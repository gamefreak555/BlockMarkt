<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 Arial,Helvetica,sans-serif;background:#eaeded;color:#0f1111}a{text-decoration:none}

button.ok{background:#ffa41c;border-color:#ff8f00}button.ok:hover{background:#fa8900}
header{background:#131921;color:#fff;display:flex;gap:14px;align-items:center;padding:8px clamp(12px,3vw,32px);flex-wrap:wrap}
.logo{font-size:22px;font-weight:700;color:#fff}.logo b{color:#febd69}
.sb{flex:1;display:flex;min-width:220px;max-width:760px}.sb input{flex:1;border:0;border-radius:4px 0 0 4px;padding:10px 12px}
.sb button{background:#febd69;border:0;border-radius:0 4px 4px 0;padding:0 18px}.sb button:hover{background:#f3a847}
header button.s{background:transparent;border-color:#555;color:#fff}header button.s:hover{background:#2b3645}
.acc{display:inline-flex;flex-direction:column;line-height:1.2;font-size:12px;margin-right:6px}.acc b{font-size:14px}
#tabs{background:#232f3e;padding:4px clamp(12px,3vw,32px);display:flex;gap:6px;flex-wrap:wrap}
#tabs button{background:none;border:1px solid transparent;border-radius:2px;color:#fff;padding:7px 12px}
#tabs button:not(.s){border-color:#fff}#tabs button:hover{border-color:#fff}
main{max-width:1700px;margin:16px auto;padding:0 clamp(12px,3vw,32px)}
.hero{background:linear-gradient(135deg,#232f3e,#37475a);color:#fff;padding:22px 24px;border-radius:6px;margin-bottom:14px;font-size:18px}
#cnt{margin:0 0 10px;font-size:13px;color:#565959}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:#fff;border:1px solid #d5d9d9;border-radius:8px;padding:14px}
.p{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:12px}.p small{color:#565959}.p button{margin-top:4px}
.t{color:#007185;cursor:pointer;font-size:15px;line-height:1.3}.t:hover{color:#c7511f;text-decoration:underline}
.ic{display:grid;place-items:center;font-size:32px;background:#f0f2f2;border-radius:4px}
img.ic{background:#f7f8f8;image-rendering:pixelated;object-fit:contain}
.p .ic{width:100%;height:120px;padding:10px}dialog .ic{width:72px;height:72px;margin-bottom:8px}
.tag{border-radius:4px;padding:2px 8px;font-size:12px;margin-left:6px;background:#eee}
.tag.offen{background:#fff3cd;color:#8a6d00}.tag.angenommen{background:#d4edda;color:#1e6b34}.tag.abgelehnt{background:#f8d7da;color:#842029}
.pr{color:#b12704}
dialog{background:#fff;color:#0f1111;border:0;border-radius:10px;width:min(94vw,460px);max-height:92vh;overflow:auto}dialog::backdrop{background:#0008}
footer{background:#232f3e;color:#ddd;text-align:center;padding:18px;margin-top:30px;font-size:12px}
html[data-theme=dark]{color-scheme:dark}
html[data-theme=dark] body{background:#0f1111;color:#e7e9ea}
html[data-theme=dark] .card{background:#1a1f26;border-color:#2f3a45}

html[data-theme=dark] .t{color:#4db8d1}html[data-theme=dark] .t:hover{color:#ffa41c}
html[data-theme=dark] #cnt,html[data-theme=dark] .p small{color:#9aa4ad}

.card{overflow-wrap:anywhere}
button.dl{float:right;padding:3px 10px;font-size:12px;margin-left:8px}.otb{display:flex;justify-content:flex-end;margin-bottom:10px}

.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;width:min(420px,100%);background:#fff;color:#0f1111;border:1px solid #d5d9d9;border-left:5px solid #c7511f;border-radius:10px;padding:11px 12px;box-shadow:0 8px 28px #0003;animation:tin .25s ease}
.toast.ok{border-left-color:#1e8e4e}.toast.info{border-left-color:#007185}
.toast .ti{font-size:18px;line-height:1.25}.toast .tm{flex:1;line-height:1.4;padding-top:1px}
.toast .tx2{background:none;border:0;padding:0 4px;font-size:20px;line-height:1;color:inherit;opacity:.55;border-radius:4px}.toast .tx2:hover{opacity:1;background:none}
.toast.out{opacity:0;transform:translateX(24px);transition:.25s}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.lp{text-align:center;padding:10px 14px 6px}.lp .lpi{font-size:38px;line-height:1.1}.lp h3{margin:6px 0 4px}.lp p{margin:0 0 16px;color:#565959}.lpb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.lpb a{text-decoration:none}
button.dc{background:#5865f2;border-color:#4752c4;color:#fff;font-weight:600}button.dc:hover{background:#4752c4}
html[data-theme=dark] .toast{background:#1a1f26;color:#e7e9ea;border-color:#2f3a45}html[data-theme=dark] .toast.ok{border-left-color:#3fb36f}html[data-theme=dark] .toast{border-left-color:#ff8a65}html[data-theme=dark] .toast.ok{border-left-color:#3fb36f}html[data-theme=dark] .toast.info{border-left-color:#4db8d1}html[data-theme=dark] .lp p{color:#9aa4ad}
.chat{margin-top:10px;border-top:1px solid #d5d9d9;padding-top:8px}.chat summary{cursor:pointer;font-weight:600}
.badge{background:#c7511f;color:#fff;border-radius:10px;padding:1px 7px;font-size:12px}
.msgs{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0;padding:4px}
.msg{max-width:80%;padding:6px 10px;border-radius:10px;background:#f0f2f2}.msg.me{align-self:flex-end;background:#ffe9a8}.msg.them{align-self:flex-start}
.msg small{color:#565959;display:block;font-size:11px}.msg .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.cin{display:flex;gap:6px}.cin input{flex:1;min-width:0}
html[data-theme=dark] .chat{border-color:#2f3a45}html[data-theme=dark] .msg{background:#2b333c}html[data-theme=dark] .msg.me{background:#5a4a14}html[data-theme=dark] .msg small{color:#9aa4ad}#view input,#view select{max-width:100%}
@media(min-width:1500px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
@media(max-width:700px){.sb{order:3;flex-basis:100%;max-width:none}.hero{padding:16px;font-size:15px}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.p .ic{height:90px}.fxp{font-size:18px}.logo{font-size:19px}header{gap:8px}#tabs{flex-wrap:nowrap;overflow-x:auto}#tabs button{white-space:nowrap}}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.p{padding:10px}.card{padding:10px}}

const fxl=i=>{const l=prices.filter(p=>p.itemId===i.id);return l.length?`<div class=fxl>${l.slice(0,3).map(p=>`<div class=fxr><b class="pr fxp">${p.price} ${e(cn(p.cur))}</b><small class=fx>🏷 ${p.count}× ${T('ul_'+p.unit)}</small></div>`).join('')}${l.length>3?`<small class=fx>+${l.length-3} …</small>`:''}</div>`:''};
const cn=c=>c?(lang==='en'?c.en:c.de):'';
const curSel=p=>`<select id=${p}cur onchange="curCh('${p}')">${currencies.map(c=>`<option value="${e(c.id)}">${e(cn(c))}</option>`).join('')}<option value=other>${T('cur_other')}</option></select><input id=${p}curt placeholder="${T('cur_other_ph')}" maxlength=40 style="display:none;width:100%;margin-top:6px">`;
function curCh(p){$('#'+p+'curt').style.display=$('#'+p+'cur').value==='other'?'block':'none'}
function order(id){if(!me.user)return loginPrompt();const i=items.find(x=>x.id===id);
 $('#dlg').innerHTML=`${ic(i)}<h3>${e(nm(i))}</h3>${fxbox(i)}<p><select id=u><option value=item>${T('u_item')}</option><option value=stack>${T('u_stack')} (×${i.stack})</option><option value=dk>${T('u_dk')} (×${54*i.stack})</option></select> <input id=c type=number min=1 value=1 style="width:80px"></p><p><input id=p type=number min=0 step=any placeholder="${T('price')}" style="width:150px"> ${curSel('o')}</p><p><input id=n placeholder="${T('note')}" style="width:100%"></p><button onclick="send(${id})">${T('send')}</button> <button class=s onclick="$('#dlg').close()">${T('cancel')}</button>`;$('#dlg').showModal()}
function fxbox(i){const l=prices.filter(p=>p.itemId===i.id);return l.length?`<div class=fxbox><b>${T('fixedh')}</b>${l.map(p=>`<div class=fxrow><span id=fs${p.id}>${fxSum(p,1)}</span><span class=fxm><label>${T('fx_qty')} × <input id=fm${p.id} type=number min=1 max=10000 value=1 oninput="fmUpd(${p.id})"></label><button class=ok onclick="sendFixed(${p.id})">${T('buyfixed')}</button></span></div>`).join('')}</div><small>${T('orneg')}</small>`:''}
const rnd=x=>Math.round(x*1e6)/1e6,fmv=pid=>{const v=Math.floor(+$('#fm'+pid).value);return v>=1?Math.min(v,10000):1};
const fxSum=(p,m)=>`${p.count*m}× ${T('ul_'+p.unit)} (${p.qty*m} ${T('pcs')}) – <b class=pr>${rnd(p.price*m)} ${e(cn(p.cur))}</b>`;
function fmUpd(pid){const p=prices.find(x=>x.id===pid);if(p)$('#fs'+pid).innerHTML=fxSum(p,fmv(pid))}
async function sendFixed(pid){const r=await api('/orders','POST',{fixedId:pid,mult:fmv(pid),note:$('#n').value});if(r.ok){$('#dlg').close();tab='orders';render();toast(T('ok_sent'),'ok')}}
async function send(id){const r=await api('/orders','POST',{itemId:id,unit:$('#u').value,count:+$('#c').value,price:+$('#p').value,currency:$('#ocur').value,currencyText:$('#ocurt').value,note:$('#n').value});if(r.ok){$('#dlg').close();tab='orders';render();toast(T('ok_sent'),'ok')}}
let lastO='';
async function orders(poll){let os;
 if(poll){try{const r=await fetch('/api/orders');if(!r.ok)return;os=await r.json()}catch{return}}else os=await api('/orders');
 if(!Array.isArray(os)||tab!=='orders')return;
 const sig=lang+JSON.stringify(os);if(poll&&sig===lastO)return;lastO=sig;
 os.forEach(o=>OB[o.id]=o);
 const v=$('#view'),keep={},sc={};v.querySelectorAll('input').forEach(x=>{if(x.id)keep[x.id]=x.value});v.querySelectorAll('.msgs').forEach(x=>sc[x.id]={t:x.scrollTop,b:x.scrollTop+x.clientHeight>=x.scrollHeight-8});
 const fid=document.activeElement&&v.contains(document.activeElement)?document.activeElement.id:'';
 const nf=os.filter(o=>o.canDel&&o.status!=='offen').length;
 v.innerHTML=(nf?`<div class=otb><button class=s onclick="delFinished()">🗑 ${T('del_fin')} (${nf})</button></div>`:'')+(os.length?os.map(card).join(''):`<p>${T('none')}</p>`);
 for(const k in keep){const x=document.getElementById(k);if(x)x.value=keep[k]}
 v.querySelectorAll('.msgs').forEach(x=>{const z=sc[x.id];x.scrollTop=!z||z.b?x.scrollHeight:z.t});saveSeen();
 if(fid){const x=document.getElementById(fid);if(x)x.focus()}}
function card(o){const s=o.side,last=o.offers.at(-1),turn=o.status==='offen'&&s&&last.by!==s;
 return `<div class=card style="margin-bottom:12px">${o.canDel?`<button class="s dl" onclick="delOrder(${o.id})" title="${T('del')}">🗑 ${T('del')}</button>`:''}${o.pic?`<img src="${e(o.pic)}" style="width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:8px">`:o.img||o.w?`<img src="${isrc(o)}" onerror="imgFb(this,'${e(o.k)}',${o.w&&o.img?1:0})" style="width:28px;height:28px;image-rendering:pixelated;vertical-align:middle;margin-right:8px">`:''}<b>${o.count}× ${T('ul_'+o.unit)} ${e(nm({name:o.item,de:o.itemDe}))}</b> = ${o.qty} ${T('pcs')} <span class="tag ${o.status}">${T('st_'+o.status)}</span>${o.fixed?`<span class=tag>🏷 ${T('fixedtag')}</span>`:''}<br><small>${T('buyer')}: ${e(o.buyerName)}${o.sellerName?' · '+T('seller')+': '+e(o.sellerName):''}${o.note?' · '+e(o.note):''}</small><ul>${o.offers.map(f=>`<li>${T(f.by)} (${e(f.name)}): <b class=pr>${f.price} ${e(cn(o.cur))}</b></li>`).join('')}</ul>`+
 (o.status==='offen'&&s?(turn?`<button class=ok onclick="act(${o.id},'accept')">${T('accept')} (${last.price} ${e(cn(o.cur))})</button>${o.fixed?'':` <input id=o${o.id} type=number min=0 step=any placeholder="${T('counterph')}" style="width:130px"> <button class=s onclick="counter(${o.id})">${T('counter')}</button> `}`:`<small>${T('waiting')} </small>`)+`<button class=s onclick="act(${o.id},'decline')">${T('decline')}</button>`:'')+chatBox(o)+`</div>`}
const openChats=new Set(),OB={},seen=(()=>{try{return JSON.parse(localStorage.getItem('seen')||'{}')}catch{return{}}})();
const saveSeen=()=>{try{localStorage.setItem('seen',JSON.stringify(seen))}catch{}};
const ft=t=>{const d=new Date(t),td=new Date();return(d.toDateString()===td.toDateString()?'':d.toLocaleDateString([],{day:'2-digit',month:'2-digit'})+' ')+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
function chatBox(o){if(!o.side)return'';const m=o.msgs||[];if(o.status==='abgelehnt'&&!m.length)return'';
 const op=openChats.has(o.id),un=op?0:m.slice(seen[o.id]||0).filter(x=>x.by!==o.side).length;if(op)seen[o.id]=m.length;
 return `<details class=chat ${op?'open':''} ontoggle="chatTog(${o.id},this.open)"><summary>💬 ${T('chat')} (${m.length})${un?` <span class=badge>${un}</span>`:''}</summary><div class=msgs id=m${o.id}>${m.map(x=>`<div class="msg ${x.by===o.side?'me':'them'}"><small>${e(x.name)} · ${ft(x.t)}</small><div class=tx>${e(x.text)}</div></div>`).join('')||`<small>${T('chat_empty')}</small>`}</div>${o.status==='abgelehnt'?'':`<div class=cin><input id=ci${o.id} maxlength=500 placeholder="${T('chat_ph')}" onkeydown="if(event.key==='Enter')chatSend(${o.id})"><button onclick="chatSend(${o.id})">${T('chat_send')}</button></div>`}</details>`}
function chatTog(id,open){if(open){openChats.add(id);const o=OB[id];if(o){seen[id]=(o.msgs||[]).length;saveSeen()}const b=$('#m'+id);if(b){b.scrollTop=b.scrollHeight;const bd=b.closest('details').querySelector('.badge');if(bd)bd.remove()}}else openChats.delete(id)}
async function chatSend(id){const i=$('#ci'+id),t=i.value.trim();if(!t)return;i.value='';const r=await api('/orders/'+id+'/chat','POST',{text:t});if(r.ok)orders();else i.value=t}
function confirmBox(msg,fn){$('#dlg').innerHTML=`<div class=lp><div class=lpi>🗑</div><p style="color:inherit;font-size:15px">${e(msg)}</p><div class=lpb><button class=ok id=cok>${T('del')}</button><button class=s onclick="$('#dlg').close()">${T('cancel')}</button></div></div>`;$('#cok').onclick=async()=>{$('#dlg').close();await fn()};$('#dlg').showModal()}
function delOrder(id){confirmBox(T('del_confirm'),async()=>{const r=await api('/orders/'+id,'DELETE');if(r.ok){toast(T('ok_deleted'),'ok');orders()}})}
function delFinished(){confirmBox(T('del_fin_confirm'),async()=>{const r=await api('/orders/finished','DELETE');if(r.ok){toast(T('ok_deleted')+' ('+r.deleted+')','ok');orders()}})}
async function act(id,a){await api(`/orders/${id}/${a}`,'POST');orders()}
async function counter(id){const p=$('#o'+id).value;if(p==='')return;$('#o'+id).value='';await api(`/orders/${id}/offer`,'POST',{price:+p});orders()}
async function admin(){const s=await api('/sellers');
 $('#view').innerHTML=`<h3>${T('sellers_h')}</h3>${s.map(x=>`<div class=card style="margin-bottom:8px">${e(x.id)} – ${e(x.note)} <button class=s onclick="del('/sellers/${x.id}')">${T('remove')}</button></div>`).join('')||`<p>${T('nosellers')}</p>`}
 <p><input id=sid placeholder="${T('did')}"> <input id=sn placeholder="${T('nn')}"> <button onclick="addS()">${T('add')}</button></p>
 <h3>${T('fp_h')}</h3><div id=fpl></div><p><input id=fpi list=fpd placeholder="${T('iname')}"><datalist id=fpd>${items.map(i=>`<option value="${e(nm(i))}">`).join('')}</datalist> <select id=fpu><option value=item>${T('u_item')}</option><option value=stack>${T('u_stack')}</option><option value=dk>${T('u_dk')}</option></select> <input id=fpc type=number min=1 value=1 style="width:80px"> <input id=fpp type=number min=0 step=any placeholder="${T('fp_price')}" style="width:110px"> ${curSel('f')} <button onclick="addFp()">${T('add')}</button></p>
 <h3>${T('cur_h')}</h3>${currencies.map(c=>`<div class=card style="margin-bottom:8px">${e(cn(c))} <button class=s onclick="del('/currencies/${c.id}')">${T('del')}</button></div>`).join('')}<p><input id=cnm placeholder="${T('cur_name')}"> <button onclick="addC()">${T('add')}</button></p>
 <h3>${T('items_h')} (${items.length})</h3><input id=aq placeholder="${T('search')}" oninput="alist()" style="width:100%;margin-bottom:8px"><div id=al></div>
 <p><input id=in placeholder="${T('iname')}"> <select id=is><option>64</option><option>16</option><option>1</option></select> <label><small>${T('img_pick')}:</small> <input id=iimg type=file accept="image/*"></label> <button onclick="addI()">${T('additem')}</button></p>`;alist();fplist()}
function alist(){const q=($('#aq').value||'').toLowerCase();$('#al').innerHTML=items.filter(i=>(i.name+' '+(i.de||'')).toLowerCase().includes(q)).slice(0,30).map(i=>`<div class=card style="margin-bottom:8px;display:flex;gap:10px;align-items:center">${sic(i,24)}${e(nm(i))} (${T('stack')} ${i.stack}) <button class=s onclick="del('/items/${i.id}')">${T('del')}</button>${i.custom?` <button class=s onclick="this.nextElementSibling.click()">${T('img_change')}</button><input type=file accept="image/*" hidden onchange="setImg(${i.id},this)">`:''}</div>`).join('')}
function fplist(){$('#fpl').innerHTML=prices.map(p=>{const i=items.find(x=>x.id===p.itemId);return i?`<div class=card style="margin-bottom:8px;display:flex;gap:10px;align-items:center">${sic(i,24)}${e(nm(i))} – ${p.count}× ${T('ul_'+p.unit)} (${p.qty} ${T('pcs')}) = <b class=pr>${p.price} ${e(cn(p.cur))}</b> <button class=s onclick="del('/prices/${p.id}')">${T('del')}</button></div>`:''}).join('')||`<p>${T('none')}</p>`}
async function addFp(){const v=$('#fpi').value.trim().toLowerCase(),i=items.find(x=>nm(x).toLowerCase()===v||x.name.toLowerCase()===v||(x.de||'').toLowerCase()===v);if(!i)return toast(T('err_no_item'));const pv=$('#fpp').value;const r=await api('/prices','POST',{itemId:i.id,unit:$('#fpu').value,count:+$('#fpc').value,price:pv===''?-1:+pv,currency:$('#fcur').value,currencyText:$('#fcurt').value});if(r.ok)await load()}
async function del(p){await api(p,'DELETE');await load()}
async function addC(){await api('/currencies','POST',{name:$('#cnm').value});await load()}
async function addS(){await api('/sellers','POST',{id:$('#sid').value,note:$('#sn').value});admin()}
const readImg=f=>new Promise(res=>{if(!f)return res(null);const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*m));c.height=Math.max(1,Math.round(im.height*m));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)});
async function addI(){const f=$('#iimg').files[0],img=await readImg(f);if(f&&!img)return toast(T('err_invalid_image'));await api('/items','POST',{name:$('#in').value,stack:$('#is').value,image:img});await load()}
async function setImg(id,inp){const img=await readImg(inp.files[0]);if(!img)return toast(T('err_invalid_image'));await api('/items/'+id+'/image','POST',{image:img});await load()}
setInterval(()=>{if(tab==='orders'&&!document.hidden)orders(true)},2000);
load().catch(()=>{$('#view').innerHTML='<div class=card>'+T('unreach')+'</div>'});
</script></html>
